AWSTemplateFormatVersion: '2010-09-09'
Description: Bug report tool - DynamoDB table, Lambda function, and IAM role

Resources:

  BugReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub
        - BugReports-${Suffix}
        - Suffix: !Select [0, !Split ["-", !Select [2, !Split ["/", !Ref "AWS::StackId"]]]]
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ticketId
          AttributeType: S
      KeySchema:
        - AttributeName: ticketId
          KeyType: HASH

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub
        - create-bug-report-role-${Suffix}
        - Suffix: !Select [0, !Split ["-", !Select [2, !Split ["/", !Ref "AWS::StackId"]]]]
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBPutItem
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt BugReportsTable.Arn

  CreateBugReportFunction:
    Type: AWS::Lambda::Function
    DependsOn: LambdaExecutionRole
    Properties:
      FunctionName: !Sub
        - create-bug-report-${Suffix}
        - Suffix: !Select [0, !Split ["-", !Select [2, !Split ["/", !Ref "AWS::StackId"]]]]
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref BugReportsTable
      Code:
        ZipFile: |
          import json
          import os
          import uuid
          from datetime import datetime, timezone
          import boto3

          table = boto3.resource("dynamodb").Table(
            os.environ["TABLE_NAME"]
          )


          def lambda_handler(event, _):
            print("EVENT:", json.dumps(event, indent=2, default=str))

            try:
                # =========================================================
                # 1. GET INPUT
                #
                # Bedrock Flow:
                # event["node"]["inputs"][0]["value"]
                #
                # Lambda Console test:
                # event["description"]
                # =========================================================

                if "node" in event:
                    node = event.get("node", {})
                    inputs = node.get("inputs", [])

                    if not inputs:
                        raise ValueError(
                            "No inputs received from Bedrock Flow"
                        )

                    code_hook_input = None

                    for item in inputs:
                        if item.get("name") == "codeHookInput":
                            code_hook_input = item.get("value")
                            break

                    if code_hook_input is None:
                        raise ValueError(
                            "codeHookInput was not found in node inputs"
                        )

                    print(
                        "CODE HOOK INPUT:",
                        repr(code_hook_input)
                    )

                    # Bedrock Flow provides the value as a STRING.
                    # CollectBugInfo now returns clean JSON.
                    if isinstance(code_hook_input, str):
                        body = json.loads(code_hook_input)
                    else:
                        body = code_hook_input

                else:
                    # Direct Lambda Console test event
                    body = event

                print(
                    "PARSED BODY:",
                    json.dumps(body, indent=2, default=str)
                    )

                # =========================================================
                # 2. VALIDATE INPUT
                # =========================================================

                if not isinstance(body, dict):
                    raise ValueError(
                        f"Expected JSON object, got {type(body).__name__}"
                    )

                description = (
                    body.get("description") or ""
                ).strip()

                steps = (
                    body.get("stepsToReproduce") or ""
                ).strip()

                environment = (
                    body.get("environment") or ""
                ).strip()

                print("DESCRIPTION:", description)
                print("STEPS:", steps)
                print("ENVIRONMENT:", environment)

                if not description:
                    return json.dumps({
                        "status": "ERROR",
                        "error": "missing",
                        "field": "description"
                    })

                # =========================================================
                # 3. CREATE BUG REPORT
                # =========================================================

                ticket_id = str(uuid.uuid4())

                item = {
                    "ticketId": ticket_id,
                    "description": description,
                    "stepsToReproduce": steps,
                    "environment": environment,
                    "status": "OPEN",
                    "createdAt": datetime.now(
                        timezone.utc
                    ).isoformat(),
                }

                table.put_item(Item=item)

                print(
                    "DYNAMODB ITEM:",
                    json.dumps(item, indent=2, default=str)
                )

                # =========================================================
                # 4. RETURN RESULT
                #
                # IMPORTANT:
                # Bedrock Flow expects the Lambda result to be a String.
                #
                # Do NOT return the Agent-style:
                #
                # {
                #   "messageVersion": "1.0",
                #   "response": {
                #       "functionResponse": ...
                #   }
                # }
                # =========================================================

                result = {
                    "ticketId": ticket_id,
                    "status": "OPEN"
                }

                print(
                    "RESULT:",
                    json.dumps(result)
                )

                return json.dumps(result)

            except Exception as exc:
                print(
                    "ERROR:",
                    type(exc).__name__,
                    str(exc)
                )

                return json.dumps({
                    "status": "ERROR",
                    "error": str(exc)
                })

  BedrockInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt CreateBugReportFunction.Arn
      Action: lambda:InvokeFunction
      Principal: bedrock.amazonaws.com

Outputs:
  BugReportsTableArn:
    Description: ARN of the BugReports DynamoDB table
    Value: !GetAtt BugReportsTable.Arn

  LambdaFunctionArn:
    Description: ARN of the create-bug-report Lambda function
    Value: !GetAtt CreateBugReportFunction.Arn

  LambdaExecutionRoleArn:
    Description: ARN of the Lambda execution IAM role
    Value: !GetAtt LambdaExecutionRole.Arn
